# Runs in front of gunicorn inside the web container. The platform's edge proxy terminates TLS
# and forwards plain HTTP to this server on port 80.
server {
    listen 80;
    client_max_body_size 20m;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /data/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
